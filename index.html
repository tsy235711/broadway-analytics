<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Interactive Broadway performance, attendance, and ticket analytics."
  >
  <title>Broadway Analytics</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #09070d;
      --surface: #17111f;
      --surface-light: #24172c;
      --gold: #f4c95d;
      --gold-dark: #b98928;
      --text: #fffaf0;
      --muted: #bdb4c4;
      --border: rgba(244, 201, 93, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 85% 0%, rgba(125, 34, 86, 0.32), transparent 35rem),
        var(--background);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    a {
      color: inherit;
    }

    .site-header {
      padding: 4.5rem clamp(1.25rem, 6vw, 6rem) 3.5rem;
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 850px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.8rem, 7vw, 6.5rem);
      font-weight: 500;
      line-height: 0.95;
    }

    .intro {
      max-width: 650px;
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    .navigation {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 0.5rem;
      padding: 1rem clamp(1.25rem, 6vw, 6rem);
      overflow-x: auto;
      background: rgba(9, 7, 13, 0.9);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .tab {
      flex: 0 0 auto;
      padding: 0.7rem 1rem;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
    }

    .tab:hover,
    .tab:focus-visible {
      color: var(--text);
      border-color: var(--border);
      outline: none;
    }

    .tab.active {
      color: #211505;
      background: var(--gold);
      border-color: var(--gold);
    }

    main {
      padding: 2rem clamp(1rem, 4vw, 4rem) 4rem;
    }

    .report-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      max-width: 1500px;
      margin: 0 auto 1rem;
    }

    h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.6rem, 3vw, 2.5rem);
      font-weight: 500;
    }

    #report-description {
      margin: 0.4rem 0 0;
      color: var(--muted);
    }

    .report-frame {
      width: 100%;
      max-width: 1500px;
      height: min(78vh, 850px);
      min-height: 560px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      padding: 1.5rem;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 700px) {
      .site-header {
        padding-top: 3rem;
      }

      .report-heading {
        align-items: start;
        flex-direction: column;
      }

      .report-frame {
        min-height: 500px;
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">Data takes center stage</p>
    <h1>Broadway Analytics</h1>
    <p class="intro">
      Explore the shows, theatres, audiences, and ticket trends shaping Broadway.
    </p>
  </header>

  <nav class="navigation" aria-label="Report pages">
    <button class="tab active" type="button" data-page="ReportSection">Overview</button>
    <button class="tab" type="button" data-page="ReportSectionShows">Shows</button>
    <button class="tab" type="button" data-page="ReportSectionTheatres">Theatres</button>
    <button class="tab" type="button" data-page="ReportSectionTickets">Ticket Sales</button>
  </nav>

  <main>
    <div class="report-heading">
      <div>
        <h2 id="report-title">Overview</h2>
        <p id="report-description">A snapshot of Broadway's latest performance.</p>
      </div>
    </div>

    <div class="report-frame">
      <iframe
        id="powerbi-report"
        title="Broadway Analytics overview"
        allowfullscreen
      ></iframe>
    </div>
  </main>

  <footer>Broadway Analytics</footer>

  <script>
    const POWER_BI_EMBED_URL =
      "https://msit.powerbi.com/reportEmbed?reportId=dc4cd647-b8d5-4627-984f-ca8e05684e54&autoAuth=true&ctid=72f988bf-86f1-41af-91ab-2d7cd011db47";

    const pageDetails = {
      ReportSection: {
        title: "Overview",
        description: "A snapshot of Broadway's latest performance."
      },
      ReportSectionShows: {
        title: "Shows",
        description: "Compare productions, attendance, and weekly grosses."
      },
      ReportSectionTheatres: {
        title: "Theatres",
        description: "Explore performance across Broadway venues."
      },
      ReportSectionTickets: {
        title: "Ticket Sales",
        description: "Follow pricing, demand, and sales trends."
      }
    };

    const report = document.querySelector("#powerbi-report");
    const tabs = document.querySelectorAll(".tab");
    const title = document.querySelector("#report-title");
    const description = document.querySelector("#report-description");

    function showPage(pageName) {
      const separator = POWER_BI_EMBED_URL.includes("?") ? "&" : "?";
      report.src = `${POWER_BI_EMBED_URL}${separator}pageName=${encodeURIComponent(pageName)}`;

      const details = pageDetails[pageName];
      title.textContent = details.title;
      description.textContent = details.description;
      report.title = `Broadway Analytics ${details.title}`;

      tabs.forEach((tab) => {
        const selected = tab.dataset.page === pageName;
        tab.classList.toggle("active", selected);
        tab.setAttribute("aria-pressed", selected);
      });
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => showPage(tab.dataset.page));
    });

    showPage("ReportSection");
  </script>
</body>
</html>
